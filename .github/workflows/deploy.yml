name: Deploy Vue App to GitHub Pages

on:
  push:
    branches: [ "main" ] # Change to "master" if your default branch is master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm' # Use 'yarn' or 'pnpm' if you don't use npm

      - name: Install Dependencies
        run: npm ci # Or npm install / yarn install

      - name: Build Project
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist # Change to './build' if using Vue CLI
